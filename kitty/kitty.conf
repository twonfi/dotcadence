font_family Cascadia Code
font_size 11

background_opacity 0.7
background_blur 1

remember_window_size no
initial_window_width 120c
initial_window_height 35c
window_padding_width 2
window_padding_height 2

cursor_shape underline
cursor_underine_thickness 0.3

shell_integration no-title no-cursor
hide_window_decorations no

bell_path ~/dotcadence/resource/bell.wav

# Port of Konsole Dark Pastels (with my modifications)
foreground #dcdccc
background #3f3f3f
cursor #87bdfd

# Black
color0 #4f4f4f
color8 #709080

# Red
color1 #bf6f6f
color9 #dca3a3

# Green
color2  #60b48a
color10 #72d5a3

# Yellow
