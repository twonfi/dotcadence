version = 4
final_space = true

[transient_prompt]
  background = 'transparent'
  foreground = '#CD4277'
  template = ' <b>{{ .PWD }}</b> <#26C6DA>❯</><#45F1C2>❯</> '
  type = 'path'

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    leading_diamond = ''
    template = '{{ .Icon }} {{ .HostName }} '
    foreground = '#00c983'
    background = '#003543'
    type = 'os'
    style = 'diamond'

  [[blocks.segments]]
    template = ' <#000> </> {{ .Path }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#DA627D'
    type = 'path'
    style = 'powerline'

    [blocks.segments.options]
      folder_icon = ''
      home_icon = '~'
      style = 'full'

      [blocks.segments.options.mapped_locations]
      "/armarouge" = " C:"

  [[blocks.segments]]
    template = ' ➜ ({{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}) '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#FCA17D'
    type = 'git'
    style = 'powerline'

    [blocks.segments.options]
      branch_icon = ' <#ffffff> </>'

  [[blocks.segments]]
    template = '  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#76b367'
    type = 'node'
    style = 'powerline'

  [[blocks.segments]]
    template = '  {{ .FormattedMs }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#83769c'
    type = 'executiontime'
    style = 'powerline'

    [blocks.segments.options]
      always_enabled = true

  [[blocks.segments]]
    template = '  {{ .CurrentDate | date .Format }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#33658A'
    type = 'time'
    style = 'powerline'

    [blocks.segments.options]
      time_format = '3:04 PM'

  [[blocks.segments]]
    trailing_diamond = ''
    template = ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#2e9599'
    type = 'status'
    style = 'diamond'
    background_templates = ['{{ if gt .Code 0 }}red{{ end }}']

    [blocks.segments.options]
      always_enabled = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = ' '
    foreground = '#cd5e42'
    type = 'root'
    style = 'plain'

  [[blocks.segments]]
    template = ' <#2e9599>󰐝</> <b>{{ .UserName }}</b> <#26C6DA>❯</><#45F1C2>❯</>'
    foreground = '#CD4277'
    type = 'text'
    style = 'plain'
